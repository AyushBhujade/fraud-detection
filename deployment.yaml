apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-detection
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fraud-detection
  template:
    metadata:
      labels:
        app: fraud-detection
    spec:
      containers:
      - name: fraud-detection
        image: fraud-detection:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        envFrom:
            - configMapRef:
                name: fraud-config
        resources:
          limits:
            memory: "521Mi"
            cpu: "500m"
            
        



--- 
apiVersion: v1
kind: Service
metadata:
  name: fraud-detection
spec:
  type: NodePort
  selector:
    app: fraud-detection
  ports:
  - port: 8000
    targetPort: 8000

      
